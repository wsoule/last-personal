{{define "return-result"}}
<div class="output">
    <div class="result-section">
        <div class="result-highlight">
            <div class="result-row">
                <span class="result-label">CAGR</span>
                <span class="result-value">{{printf "%.2f" .AnnualizedReturn}}%</span>
            </div>
        </div>
    </div>
    <div class="result-section">
        <div class="result-section-header">Returns</div>
        <div class="result-row">
            <span class="result-label">Total Return</span>
            <span class="result-value">${{printf "%.2f" .TotalReturn}}</span>
        </div>
        <div class="result-row">
            <span class="result-label">Percent Return</span>
            <span class="result-value">{{printf "%.2f" .PercentReturn}}%</span>
        </div>
    </div>
</div>
{{end}}
