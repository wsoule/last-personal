{{define "counter"}}
<p class="counter-display" id="counter-value">{{.Count}}</p>
<div class="counter-buttons">
    <button hx-post="/decrement" hx-target="#counter-section" hx-swap="innerHTML">-</button>
    <button hx-post="/increment" hx-target="#counter-section" hx-swap="innerHTML">+</button>
</div>
<p class="text-muted mt-1">Total clicks: <span id="total-clicks">{{.TotalClicks}}</span></p>
{{end}}
