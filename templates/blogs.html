<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Wyat</title>

    <style>
        /* Accessible touch targets for mobile */
        a, button, input[type="submit"] {
            display: inline-block;
            min-height: 48px;
            padding: 12px 16px;
            margin: 4px;
            box-sizing: border-box;
        }

        input[type="text"], textarea {
            min-height: 48px;
            padding: 12px;
            box-sizing: border-box;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #e0e0e0;
            }

            a {
                color: #6b9eff;
            }

            hr {
                border-color: #444444;
            }

            img {
                filter: brightness(0.8);
            }
        }
    </style>
</head>
<body>
    <h1>Blogs</h1>

    <nav>
        <a href="/">Home</a>
    </nav>

    <hr>

    <h2>All Blog Posts</h2>
    {{if .Blogs}}
        <ul>
        {{range .Blogs}}
            <li>
                <a href="/blog/{{.Filename}}">{{.Title}}</a>
            </li>
        {{end}}
        </ul>
    {{else}}
        <p>No blog posts yet.</p>
    {{end}}
</body>
</html>
