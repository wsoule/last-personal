<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Wyat</title>
    <meta name="description" content="Blog posts by Wyat, a Full Stack Developer.">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            {{template "nav" .}}

            <nav class="page-toc">
                <h3>Posts</h3>
                <ul>
                    {{range .Blogs}}
                    <li><a href="/blog/{{.Filename}}">{{.Title}}</a></li>
                    {{end}}
                </ul>
            </nav>
        </aside>

        <div class="divider"></div>

        <main class="content">
            <h1>Blog</h1>

            {{if .Blogs}}
                {{range .Blogs}}
                <div class="repo-item">
                    <a href="/blog/{{.Filename}}">{{.Title}}</a>
                </div>
                {{end}}
            {{else}}
                <p class="text-secondary">No blog posts yet.</p>
            {{end}}

            <footer>
                <p>&copy; 2025 Wyat</p>
            </footer>
        </main>
    </div>
</body>
</html>
