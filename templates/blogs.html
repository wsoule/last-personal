<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs - Wyat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <span class="prompt">wyat@site:~/blogs$</span>
        <nav hx-boost="true">
            <a href="/">[home]</a>
            <a href="/blogs">[blogs]</a>
            <a href="/finance">[finance]</a>
            <a href="https://github.com/wsoule" target="_blank">[github]</a>
        </nav>
    </header>

    <main>
        <section class="box">
            <h1>Blogs</h1>
            <p class="text-dim">$ ls -la ./posts/</p>

            {{if .Blogs}}
                {{range .Blogs}}
                <div class="repo-item">
                    <a href="/blog/{{.Filename}}">{{.Title}}</a>
                </div>
                {{end}}
            {{else}}
                <p class="text-dim">No blog posts yet.</p>
            {{end}}
        </section>

        <p><a href="/">[← back]</a></p>
    </main>

    <footer>
        <p>&copy; 2025 Wyat</p>
    </footer>
</body>
</html>
