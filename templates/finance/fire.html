<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRE Calculator - Wyat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <span class="prompt">wyat@site:~/finance$</span>
        <nav hx-boost="true">
            <a href="/">[home]</a>
            <a href="/blogs">[blogs]</a>
            <a href="/finance">[finance]</a>
        </nav>
    </header>

    <main>
        <section class="box">
            <h1>FIRE Calculator</h1>
            <p class="text-dim">$ ./fire --when-retire</p>
            <p class="text-dim">Uses 4% safe withdrawal rate (25x expenses)</p>

            <form hx-post="/api/fire-calc" hx-target="#result">
                <div class="form-row">
                    <label>current_age:</label>
                    <input type="number" name="currentAge" placeholder="30" required>
                </div>
                <div class="form-row">
                    <label>annual_income:</label>
                    <input type="number" name="annualIncome" placeholder="75000" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>annual_expenses:</label>
                    <input type="number" name="annualExpenses" placeholder="50000" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>current_savings:</label>
                    <input type="number" name="currentSavings" placeholder="50000" value="0">
                </div>
                <div class="form-row">
                    <label>annual_return:</label>
                    <input type="number" name="annualReturn" placeholder="7" step="0.1" required>
                </div>
                <button type="submit">[execute]</button>
            </form>

            <div id="result"></div>
        </section>

        <p><a href="/finance">[← back]</a></p>
    </main>

    <footer>
        <p>&copy; 2025 Wyat</p>
    </footer>
</body>
</html>
