<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inflation Calculator - Wyat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <span class="prompt">wyat@site:~/finance$</span>
        <nav hx-boost="true">
            <a href="/">[home]</a>
            <a href="/blogs">[blogs]</a>
            <a href="/finance">[finance]</a>
        </nav>
    </header>

    <main>
        <section class="box">
            <h1>Inflation Calculator</h1>
            <p class="text-dim">$ ./inflation --project</p>

            <form hx-post="/api/inflation-calc" hx-target="#result">
                <div class="form-row">
                    <label>amount:</label>
                    <input type="number" name="amount" placeholder="1000" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>years:</label>
                    <input type="number" name="years" placeholder="20" required>
                </div>
                <div class="form-row">
                    <label>inflation_rate:</label>
                    <input type="number" name="inflationRate" placeholder="3" step="0.1" required>
                </div>
                <button type="submit">[execute]</button>
            </form>

            <div id="result"></div>
        </section>

        <p><a href="/finance">[← back]</a></p>
    </main>

    <footer>
        <p>&copy; 2025 Wyat</p>
    </footer>
</body>
</html>
