<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Payoff Calculator - Wyat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <span class="prompt">wyat@site:~/finance$</span>
        <nav hx-boost="true">
            <a href="/">[home]</a>
            <a href="/blogs">[blogs]</a>
            <a href="/finance">[finance]</a>
        </nav>
    </header>

    <main>
        <section class="box">
            <h1>Debt Payoff</h1>
            <p class="text-dim">$ ./debt --payoff</p>

            <form hx-post="/api/debt-calc" hx-target="#result">
                <div class="form-row">
                    <label>debt_amount:</label>
                    <input type="number" name="debtAmount" placeholder="10000" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>interest_rate:</label>
                    <input type="number" name="interestRate" placeholder="18" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>min_payment:</label>
                    <input type="number" name="minimumPayment" placeholder="200" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>extra_payment:</label>
                    <input type="number" name="extraPayment" placeholder="100" value="0">
                </div>
                <button type="submit">[execute]</button>
            </form>

            <div id="result"></div>
        </section>

        <p><a href="/finance">[← back]</a></p>
    </main>

    <footer>
        <p>&copy; 2025 Wyat</p>
    </footer>
</body>
</html>
