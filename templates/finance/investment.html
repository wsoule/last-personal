<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Calculator - Wyat</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <span class="prompt">wyat@site:~/finance$</span>
        <nav hx-boost="true">
            <a href="/">[home]</a>
            <a href="/blogs">[blogs]</a>
            <a href="/finance">[finance]</a>
        </nav>
    </header>

    <main>
        <section class="box">
            <h1>Investment Calculator</h1>
            <p class="text-dim">$ ./investment --ticker AAPL</p>

            <form hx-post="/api/investment-calc" hx-target="#result">
                <div class="form-row">
                    <label>ticker:</label>
                    <input type="text" name="ticker" placeholder="AAPL" required>
                </div>
                <div class="form-row">
                    <label>start_date:</label>
                    <input type="date" name="startDate" required>
                </div>
                <div class="form-row">
                    <label>end_date:</label>
                    <input type="date" name="endDate" required>
                </div>
                <div class="form-row">
                    <label>amount:</label>
                    <input type="number" name="amount" placeholder="100" step="0.01" required>
                </div>
                <div class="form-row">
                    <label>frequency:</label>
                    <select name="frequency">
                        <option value="monthly">monthly</option>
                        <option value="weekly">weekly</option>
                    </select>
                </div>
                <button type="submit">[execute]</button>
            </form>

            <div id="result"></div>
        </section>

        <p><a href="/finance">[← back]</a></p>
    </main>

    <footer>
        <p>&copy; 2025 Wyat</p>
    </footer>
</body>
</html>
