<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan vs Investing - Wyat</title>
    <meta name="description" content="Compare paying off a loan early vs investing the difference.">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            {{template "nav" .}}

            <nav class="page-toc">
                <h3>On This Page</h3>
                <ul>
                    <li><a href="#calculator">Calculator</a></li>
                    <li><a href="#result">Result</a></li>
                </ul>
                <h3>Other Calculators</h3>
                <ul>
                    <li><a href="/finance/savings-goal">Savings Goal</a></li>
                    <li><a href="/finance/investment">Investment</a></li>
                    <li><a href="/finance/return">Return</a></li>
                    <li><a href="/finance/fire">FIRE</a></li>
                    <li><a href="/finance/inflation">Inflation</a></li>
                    <li><a href="/finance/debt">Debt</a></li>
                </ul>
            </nav>
        </aside>

        <div class="divider"></div>

        <main class="content">
            <h1>Loan vs Investing</h1>
            <p class="text-secondary">Compare the cost of a loan against potential investment returns.</p>

            <section id="calculator">
                <h2>Input</h2>
                <form hx-post="/api/loan-comparison" hx-target="#result" hx-indicator="#loading">
                    <div class="form-row">
                        <label>Loan Amount ($)</label>
                        <input type="number" name="loanAmount" placeholder="10000" min="1" step="0.01" required>
                    </div>
                    <div class="form-row">
                        <label>Interest Rate (%)</label>
                        <input type="number" name="interestRate" placeholder="5.5" min="0" max="50" step="0.01" required>
                    </div>
                    <div class="form-row">
                        <label>Term (Months)</label>
                        <input type="number" name="termMonths" placeholder="60" min="1" max="600" required>
                    </div>
                    <div class="form-row">
                        <label>Investment Return (%)</label>
                        <input type="number" name="investmentReturnRate" placeholder="7" min="0" max="50" step="0.01" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Calculate</button>
                        <span id="loading" class="htmx-indicator">Calculating...</span>
                    </div>
                </form>
            </section>

            <section id="result"></section>

            <footer>
                <p>&copy; 2026 Wyat</p>
            </footer>
        </main>
    </div>
</body>
</html>
